<!-- VFS File Explorer -ikkuna -->
<div class="window" style="top: 100px; left: 500px; width: 340px;" id="vfs-window">
    <div class="window-header">
        <span>VFS Explorer (C++ Kernel)</span>
        <button class="window-close" onclick="this.parentElement.parentElement.style.display='none'"></button>
    </div>
    <div class="window-body">
        <p style="margin-bottom: 8px; font-size: 12px; color: #aaa;">Järjestelmän virtuaalitiedostot:</p>
        <ul id="vfs-file-list" style="list-style: none; padding: 0; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; font-family: monospace; font-size: 11px;">
            <li style="color: #888;">Ladataan VFS-tietoja...</li>
        </ul>
        <div style="margin-top: 10px; display: flex; gap: 5px;">
            <input type="text" id="vfs-new-path" placeholder="/uusitiedosto.txt" style="flex-grow: 1; padding: 4px; font-size: 11px;">
            <button class="action-btn" style="margin-top:0;" onclick="createVFSFile()">Luo</button>
        </div>
    </div>
</div>
