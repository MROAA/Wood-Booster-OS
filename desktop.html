<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Boosterverse // Wood-Booster OS Pro</title>
    <style>
        :root { --bg-dark: #0f1117; --surface-dark: #181b24; --surface-glass: rgba(24, 27, 36, 0.85); --accent: #3b82f6; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }
        #sidebar-dock { position: absolute; right: 0; top: 0; width: 64px; height: 100vh; background: var(--surface-dark); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 12px; z-index: 1000; }
        .dock-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 1.2rem; transition: 0.15s; }
        .dock-icon:hover { background: rgba(255,255,255,0.1); }
        #desktop-area { position: absolute; top: 0; left: 0; right: 64px; bottom: 0; padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, 100px); gap: 20px; }
        .app-icon { width: 90px; height: 90px; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center; font-size: 0.75rem; }
        .app-icon:hover { background: rgba(255,255,255,0.05); border-radius: 8px; }
        .window { position: absolute; top: 80px; left: 100px; width: 650px; height: 480px; background: var(--surface-glass); backdrop-filter: blur(25px); border: 1px solid var(--border-color); border-radius: 10px; display: none; flex-direction: column; z-index: 100; }
        .win-header { height: 42px; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border-color); }
        .win-body { padding: 24px; overflow-y: auto; flex: 1; }
        #taskbar-bottom { position: absolute; bottom: 0; left: 0; right: 64px; height: 36px; background: var(--surface-dark); border-top: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="desktop-area">
        <div class="app-icon" onclick="openApp('files')"><span>📁</span><span>C:\</span></div>
        <div class="app-icon" onclick="openApp('eternity')"><span>⏳</span><span>Ikuisuus</span></div>
        <div class="app-icon" onclick="openApp('quantum')"><span>⚛️</span><span>Kvantti</span></div>
        <div class="app-icon" onclick="openApp('entropy')"><span>🌀</span><span>Entropia</span></div>
        <div class="app-icon" onclick="openApp('guardian')"><span>🛡️</span><span>Suojelija</span></div>
    </div>
    <div id="sidebar-dock">
        <div class="dock-icon" onclick="openApp('files')">📁</div>
        <div class="dock-icon" onclick="openApp('eternity')">⏳</div>
        <div class="dock-icon" onclick="openApp('quantum')">⚛️</div>
    </div>
    <div id="win" class="window">
        <div class="win-header">
            <span id="win-title">Sovellus</span>
            <button onclick="document.getElementById('win').style.display='none'">✕</button>
        </div>
        <div class="win-body" id="win-content"></div>
    </div>
    <div id="taskbar-bottom">
        <div>Wood-Booster OS // Pro-tila</div>
        <div id="clock">00:00</div>
    </div>
    <script>
        setInterval(() => { document.getElementById("clock").innerText = new Date().toLocaleTimeString(); }, 1000);
        function openApp(app) {
            const win = document.getElementById("win");
            const content = document.getElementById("win-content");
            win.style.display = "flex";
            if(app === "files") {
                document.getElementById("win-title").innerText = "Resurssienhallinta // C:";
                fetch("/api/core/windows/fs").then(r=>r.json()).then(d => {
                    content.innerHTML = "<h3>C:\ Asema</h3><pre>" + JSON.stringify(d, null, 2) + "</pre>";
                });
            } else {
                document.getElementById("win-title").innerText = app.toUpperCase();
                content.innerHTML = "<p>Ladataan " + app + "...</p>";
            }
        }
    </script>
</body>
</html>
